<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walk Xizhou, Keep Its Story — Social Design Case Study</title>
  <meta name="description" content="Walk Xizhou is a puzzle-based walking kit for a rural township in central Taiwan, designed with With Mud (與泥共好) through the CHT Foundation's social design programme to pass on local history without depending on a single guide.">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/editorial.css">
</head>
<body data-root="../../" data-project="xizhou" class="cs-xizhou">
  <!-- The Walk Xizhou case study. Same pattern as work/feetmine/index.html: the sections below are written
       out here, every word comes from content.xizhou (data-text), and css/editorial.css does the styling,
       scoped under .cs-xizhou so the rest of the site is untouched. xizhou.js fills the eleven
       repeating lists — process, quotes, insights, the photo panels — into the empty ids below. -->

  <a class="skip" href="#intro" data-text="site.skip"></a>

  <!-- The top bar and the footer are drawn by renderChrome() in site.js, so they exist once
       for the whole site rather than four times. Leave these two elements empty. -->
  <header class="topbar"></header>

  <main>

    <!-- ---------- Hero: the finished banner artwork, centred on its own colour band ---------- -->
    <div class="fm-hero">
      <img class="fm-hero-img" src="img/xizhoubanner.png" data-alt="xizhou.hero.alt" alt="">
    </div>

    <!-- ---------- Intro ---------- -->
    <section id="intro" class="fm-sec fm-light" aria-labelledby="intro-title">
      <div class="fm-wrap">
        <h1 id="intro-title" class="fm-title" data-text="xizhou.intro.title"></h1>
        <p class="fm-subtitle" data-text="xizhou.intro.subtitle"></p>
        <div class="fm-intro-grid">
          <div class="fm-intro-col">
            <p class="fm-body" data-text="xizhou.intro.body"></p>
            <div class="fm-intro-pair">
              <div>
                <h2 class="fm-label" data-text="xizhou.intro.problemLabel"></h2>
                <p data-text="xizhou.intro.problem"></p>
              </div>
              <div>
                <h2 class="fm-label" data-text="xizhou.intro.outcomeLabel"></h2>
                <p data-text="xizhou.intro.outcome"></p>
              </div>
            </div>
          </div>
          <dl class="fm-meta">
            <dt data-text="xizhou.intro.meta.roleLabel"></dt><dd data-text="xizhou.intro.meta.role"></dd>
            <dt data-text="xizhou.intro.meta.timelineLabel"></dt><dd data-text="xizhou.intro.meta.timeline"></dd>
            <dt data-text="xizhou.intro.meta.teamLabel"></dt><dd data-text="xizhou.intro.meta.team"></dd>
            <dt data-text="xizhou.intro.meta.typeLabel"></dt><dd data-text="xizhou.intro.meta.type"></dd>
          </dl>
        </div>
      </div>
    </section>

    <!-- ---------- Process: xizhou.js fills #fm-process from content.xizhou.process.steps ---------- -->
    <section class="fm-sec fm-dark" aria-labelledby="process-title">
      <div class="fm-wrap fm-split">
        <div>
          <h2 id="process-title" class="fm-h2">
            <span data-text="xizhou.process.line1"></span>
            <span class="fm-h2-soft" data-text="xizhou.process.line2"></span>
          </h2>
          <p class="fm-note" data-text="xizhou.process.lead"></p>
        </div>
        <ol class="fm-numlist fm-numlist--timeline" id="fm-process"></ol>
      </div>
    </section>

    <!-- ---------- The problem: one guide, one story ---------- -->
    <section class="fm-sec fm-light" aria-labelledby="problem-title">
      <div class="fm-wrap fm-split">
        <div>
          <h2 id="problem-title" class="fm-h2">
            <span data-text="xizhou.problem.line1"></span>
            <span class="fm-h2-soft" data-text="xizhou.problem.line2"></span>
          </h2>
        </div>
        <p class="fm-lead" data-text="xizhou.problem.lead"></p>
      </div>
      <div class="fm-wrap">
        <div class="fm-card">
          <!-- A real list, not one <p> with <br> — site-text.js strings stay text-only site-wide. -->
          <ul class="fm-note fm-bullet-list" id="fm-problem-points"></ul>
        </div>
      </div>
    </section>

    <!-- ---------- Research: three stages, a table, and two field quotes ---------- -->
    <section class="fm-sec fm-dark" aria-labelledby="research-title">
      <div class="fm-wrap fm-split">
        <div>
          <h2 id="research-title" class="fm-h2">
            <span data-text="xizhou.research.line1"></span>
            <span class="fm-h2-soft" data-text="xizhou.research.line2"></span>
          </h2>
        </div>
        <p class="fm-lead" data-text="xizhou.research.lead"></p>
      </div>
      <div class="fm-wrap">
        <div class="fm-card">
          <!-- fm-table--stage narrows the first column for a row label (Stage); the business
               table below stays plain .fm-table so its three columns split evenly. -->
          <div class="fm-table-scroll" tabindex="0" role="region" aria-labelledby="research-title">
            <table class="fm-table fm-table--stage">
              <caption class="fm-sr" data-text="xizhou.research.tableCaption"></caption>
              <thead>
                <tr>
                  <th scope="col" data-text="xizhou.research.tableStage"></th>
                  <th scope="col" data-text="xizhou.research.tableMethod"></th>
                  <th scope="col" data-text="xizhou.research.tablePurpose"></th>
                </tr>
              </thead>
              <tbody id="fm-stages"></tbody>
            </table>
          </div>
          <div id="fm-quotes"></div>
        </div>
      </div>
    </section>

    <!-- ---------- Who walks into Xizhou ---------- -->
    <section class="fm-sec fm-light" aria-labelledby="users-title">
      <div class="fm-wrap fm-split">
        <div>
          <h2 id="users-title" class="fm-h2">
            <span data-text="xizhou.users.line1"></span>
            <span class="fm-h2-soft" data-text="xizhou.users.line2"></span>
          </h2>
          <p class="fm-note" data-text="xizhou.users.lead"></p>
        </div>
        <ol class="fm-numlist" id="fm-users"></ol>
      </div>
    </section>

    <!-- ---------- The two insights that shaped every decision ---------- -->
    <section class="fm-sec fm-orange" aria-labelledby="insights-title">
      <div class="fm-wrap fm-split">
        <div>
          <h2 id="insights-title" class="fm-h2">
            <span data-text="xizhou.insights.line1"></span>
            <span class="fm-h2-soft" data-text="xizhou.insights.line2"></span>
          </h2>
        </div>
        <ol class="fm-numlist" id="fm-insights"></ol>
      </div>
    </section>

    <!-- ---------- Five design decisions, each with a reason ---------- -->
    <section class="fm-sec fm-light" aria-labelledby="decisions-title">
      <div class="fm-wrap fm-split">
        <div>
          <h2 id="decisions-title" class="fm-h2">
            <span data-text="xizhou.decisions.line1"></span>
            <span class="fm-h2-soft" data-text="xizhou.decisions.line2"></span>
          </h2>
          <p class="fm-note" data-text="xizhou.decisions.lead"></p>
        </div>
        <ol class="fm-numlist" id="fm-decisions"></ol>
      </div>
    </section>

    <!-- ---------- Design #1: teaching aids & field signage ---------- -->
    <section class="fm-sec fm-feature fm-dark" aria-labelledby="f1-title">
      <div class="fm-wrap fm-split">
        <h2 id="f1-title" class="fm-h2">
          <span data-text="xizhou.features.eyebrow1"></span>
          <span class="fm-h2-soft" data-text="xizhou.features.one.name"></span>
        </h2>
        <p class="fm-lead" data-text="xizhou.features.one.text"></p>
      </div>
      <div class="fm-panels" id="f1-panels" style="--fm-ratio: 1fr 1fr">
        <div class="fm-panel fm-grain">
          <p class="fm-panel-label" data-text="xizhou.features.one.panelALabel"></p>
          <div class="fm-full-shot">
            <img src="img/design1-1.svg" data-alt="xizhou.features.one.panelALabel" alt="" loading="lazy">
          </div>
        </div>
        <div class="fm-panel fm-grain">
          <p class="fm-panel-label" data-text="xizhou.features.one.panelBLabel"></p>
          <div class="fm-full-shot">
            <img src="img/design1-2.svg" data-alt="xizhou.features.one.panelBLabel" alt="" loading="lazy">
          </div>
        </div>
      </div>
    </section>

    <!-- ---------- Design #2: puzzle walking kit ---------- -->
    <section class="fm-sec fm-feature fm-light" aria-labelledby="f2-title">
      <div class="fm-wrap fm-split">
        <h2 id="f2-title" class="fm-h2">
          <span data-text="xizhou.features.eyebrow2"></span>
          <span class="fm-h2-soft" data-text="xizhou.features.two.name"></span>
        </h2>
        <p class="fm-lead" data-text="xizhou.features.two.text"></p>
      </div>
      <div class="fm-panels" style="--fm-ratio: 2fr 1fr">
        <div class="fm-panel fm-grain">
          <p class="fm-panel-label" data-text="xizhou.features.two.panelALabel"></p>
          <div class="fm-full-shot">
            <img src="img/design2-1.jpg" data-alt="xizhou.features.two.panelALabel" alt="" loading="lazy">
          </div>
        </div>
        <div class="fm-panel fm-grain">
          <p class="fm-panel-label" data-text="xizhou.features.two.panelBLabel"></p>
          <div class="fm-full-shot">
            <img src="img/design2-2.jpg" data-alt="xizhou.features.two.panelBLabel" alt="" loading="lazy">
          </div>
        </div>
      </div>
    </section>

    <!-- ---------- Design #3: mascot Ni Bobo ---------- -->
    <section class="fm-sec fm-feature fm-dark" aria-labelledby="f3-title">
      <div class="fm-wrap fm-split">
        <h2 id="f3-title" class="fm-h2">
          <span data-text="xizhou.features.eyebrow3"></span>
          <span class="fm-h2-soft" data-text="xizhou.features.three.name"></span>
        </h2>
        <p class="fm-lead" data-text="xizhou.features.three.text"></p>
      </div>
      <div class="fm-panels" style="--fm-ratio: 1fr 1fr">
        <div class="fm-panel fm-grain">
          <p class="fm-panel-label" data-text="xizhou.features.three.panelALabel"></p>
          <!-- TODO: replace with the character sheet export. -->
          <div class="fm-shot-placeholder" data-text="xizhou.features.three.panelALabel"></div>
        </div>
        <div class="fm-panel fm-grain">
          <p class="fm-panel-label" data-text="xizhou.features.three.panelBLabel"></p>
          <!-- TODO: replace with a photo of the mascot applied across materials. -->
          <div class="fm-shot-placeholder" data-text="xizhou.features.three.panelBLabel"></div>
        </div>
      </div>
    </section>

    <!-- ---------- Design #4: online-to-offline funnel ---------- -->
    <section class="fm-sec fm-feature fm-light" aria-labelledby="f4-title">
      <div class="fm-wrap fm-split">
        <h2 id="f4-title" class="fm-h2">
          <span data-text="xizhou.features.eyebrow4"></span>
          <span class="fm-h2-soft" data-text="xizhou.features.four.name"></span>
        </h2>
        <p class="fm-lead" data-text="xizhou.features.four.text"></p>
      </div>
      <div class="fm-panels" style="--fm-ratio: 1fr 2fr">
        <div class="fm-panel fm-grain">
          <p class="fm-panel-label" data-text="xizhou.features.four.panelALabel"></p>
          <!-- TODO: replace with a diagram export of the funnel. -->
          <div class="fm-shot-placeholder" data-text="xizhou.features.four.panelALabel"></div>
        </div>
        <div class="fm-panel fm-grain">
          <p class="fm-panel-label" data-text="xizhou.features.four.panelBLabel"></p>
          <!-- TODO: replace with a screenshot of the LINE chatbot. -->
          <div class="fm-shot-placeholder" data-text="xizhou.features.four.panelBLabel"></div>
        </div>
      </div>
      <!-- design-4.svg is a Figma export with outlined-path text (no real <text> nodes), so it
           replaces the dark card + visible step list rather than adding to it — same limitation
           as FeetMine's charts (css/editorial.css, "Image crops"): the six funnel steps' real
           bilingual text survives as the hidden fm-sr list beside it, not in the picture itself. -->
      <div class="fm-wrap">
        <div class="fm-full-shot" id="f4-funnel-shot">
          <img src="img/design-4.svg" alt="" loading="lazy">
        </div>
        <ol class="fm-sr" id="fm-funnel"></ol>
      </div>
    </section>

    <!-- ---------- Business model: a loop that benefits everyone ---------- -->
    <section class="fm-sec fm-dark" aria-labelledby="business-title">
      <div class="fm-wrap fm-split">
        <div>
          <h2 id="business-title" class="fm-h2">
            <span data-text="xizhou.business.line1"></span>
            <span class="fm-h2-soft" data-text="xizhou.business.line2"></span>
          </h2>
        </div>
        <div>
          <p class="fm-lead" data-text="xizhou.business.lead"></p>
          <div class="fm-cards" id="fm-business-cards"></div>
        </div>
      </div>
      <div class="fm-wrap">
        <div class="fm-card">
          <h3 class="fm-label" data-text="xizhou.business.flowTitle"></h3>
          <div class="fm-table-scroll" tabindex="0" role="region" aria-label="Service journey">
            <table class="fm-table">
              <thead>
                <tr>
                  <th scope="col" data-text="xizhou.business.journeyBeforeLabel"></th>
                  <th scope="col" data-text="xizhou.business.journeyDuringLabel"></th>
                  <th scope="col" data-text="xizhou.business.journeyAfterLabel"></th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td data-text="xizhou.business.journeyBefore"></td>
                  <td data-text="xizhou.business.journeyDuring"></td>
                  <td data-text="xizhou.business.journeyAfter"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------- Results ---------- -->
    <section class="fm-sec fm-feature fm-dark" aria-labelledby="results-title">
      <div class="fm-wrap fm-split">
        <div>
          <h2 id="results-title" class="fm-h2">
            <span data-text="xizhou.results.line1"></span>
            <span class="fm-h2-soft" data-text="xizhou.results.line2"></span>
          </h2>
        </div>
        <ol class="fm-numlist" id="fm-results"></ol>
      </div>
      <div class="fm-panels fm-panels--photos" id="fm-photos" style="--fm-ratio: 1fr 1fr 1fr"></div>
    </section>

    <!-- ---------- Reflection ---------- -->
    <section class="fm-sec fm-light" aria-labelledby="reflection-title">
      <div class="fm-wrap fm-split">
        <div>
          <h2 id="reflection-title" class="fm-h2">
            <span data-text="xizhou.reflection.line1"></span>
            <span class="fm-h2-soft" data-text="xizhou.reflection.line2"></span>
          </h2>
        </div>
        <!-- TODO: the owner still has to write this section (see the [bracketed] note in site-text.js). -->
        <p class="fm-lead" data-text="xizhou.reflection.body"></p>
      </div>
    </section>

    <!-- ---------- Where to go next ---------- -->
    <nav class="fm-sec fm-light fm-next" aria-label="More work">
      <div class="fm-wrap">
        <a class="fm-back-link" href="../../index.html#work" data-text="site.backToWork"></a>
      </div>
    </nav>

    <!-- The site's own closing call to action, as on the other case-study pages.
         TODO: needs xizhou.js (fm-mail-link.href = "mailto:" + content.site.email) to work — until
         then this points at "#", same as every other id-driven behaviour that needs a page script. -->
    <section class="fm-sec fm-light fm-cta-wrap" aria-labelledby="cta-title">
      <div class="fm-wrap">
        <div class="fm-cta">
          <p class="fm-eyebrow" data-text="site.nav.contact"></p>
          <h2 id="cta-title" data-text="contact.title"></h2>
          <p data-text="contact.body"></p>
          <a class="fm-button" id="fm-mail-link" href="#" data-text="contact.button"></a>
        </div>
      </div>
    </section>

  </main>

  <footer></footer>

  <script src="../../site-text.js"></script>
  <script src="../../js/site.js"></script>
  <script src="xizhou.js"></script>
</body>
</html>
