<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ILANDGREEN 島嶼綠, a case study by Chang Chu-Pei</title>
  <meta name="description" content="ILANDGREEN: a sustainable travel companion app. UX design by Chang Chu-Pei.">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-root="../../" data-project="ilandgreen">
  <!-- A case-study page. data-project above names the entry in content.js that fills this page.
       To add a project: copy this file, change data-project, and add the entry to content.js. -->

  <a class="skip" href="#study" data-text="site.skip"></a>

  <!-- The top bar and the footer are drawn by renderChrome() in site.js, so they exist once
       for the whole site rather than four times. Leave these two elements empty. -->
  <header class="topbar"></header>

  <main>
    <section id="study" class="section project">
      <div class="wrap">
        <a class="back" href="../../index.html#work" data-text="site.backToWork"></a>

        <!-- The hero: an eyebrow (the badge), the project's headline and blurb, and its stats card. -->
        <div class="case-hero">
          <div>
            <p class="case-eyebrow" id="case-badge"></p>
            <h1 id="case-headline"></h1>
            <p class="lead" id="case-blurb"></p>
          </div>
          <dl class="case-meta" id="case-meta"></dl>
        </div>

        <figure class="cover"><img id="cover" alt=""></figure>

        <!-- The phases, one after another. The links glide to each one. -->
        <nav class="phase-nav" id="phase-nav"></nav>
        <div id="phases"></div>

        <!-- The closing call to action, reusing the site's own contact copy. -->
        <div class="case-cta">
          <p class="case-eyebrow" data-text="site.nav.contact"></p>
          <h2 data-text="contact.title"></h2>
          <p class="lead" data-text="contact.body"></p>
          <p class="actions">
            <a class="button" href="../../index.html#contact" data-text="contact.button"></a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer></footer>

  <script src="../../site-text.js"></script>
  <script src="../../js/site.js"></script>
  <script src="../../js/page-project.js"></script>
</body>
</html>
